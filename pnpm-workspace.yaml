packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
# Require published packages to be at least 24h old before pnpm will
# install them, as a defense against just-published/compromised releases.
# This matches pnpm's own default; made explicit so it's a documented,
# intentional policy rather than an implicit CLI default.
minimumReleaseAge: 1440
